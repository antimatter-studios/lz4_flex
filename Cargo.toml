[package]
authors = ["Pascal Seitz <pascal.seitz@gmail.com>", "Arthur Silva <arthurprs@gmail.com>", "ticki <Ticki@users.noreply.github.com>"]
description = "A fork of lz4_flex carrying LZ4HC with a fixed-output mode (PSeitz/lz4_flex#244), published until upstream releases it."
edition = "2021"
keywords = ["compression", "lz4", "compress", "decompression", "decompress"]
name = "am-lz4-flex"
homepage = "https://github.com/antimatter-studios/lz4_flex"
repository = "https://github.com/antimatter-studios/lz4_flex"
readme = "README-am-lz4-flex.md"
license = "MIT"
version = "0.14.0"
include = ["src/*.rs", "src/frame/**/*", "src/block/**/*", "README-am-lz4-flex.md", "LICENSE"]
rust-version = "1.81"

# The library keeps lz4_flex's name, so code, tests and doctests written
# against lz4_flex build unchanged. A crate that depends on both renames this
# one, as `lz4_flex_hc = { package = "am-lz4-flex", ... }`.
[lib]
name = "lz4_flex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
lzzzz = "2.0.0"
lz4-compress = "0.1.1"
more-asserts = "0.3.1"
snap = "1.1.0"
serde_json = "1.0.91"
proptest = "1.0.0"
binggan = { version = "0.17.0"}
jemallocator = "0.5.4"

[dev-dependencies.lz-fear]
git = "https://github.com/main--/rust-lz-fear"

 #Uncomment to make lz4_flex master available as lz4_flex_master
 #[dev-dependencies.lz4_flex_master]
 #rev= "a122673" # v10
 #git = "https://github.com/PSeitz/lz4_flex"
 #package = "lz4_flex"
 #default-features=false
 #features = ["std", "safe-encode", "safe-decode", "frame"]

[features]
default = ["std", "safe-encode", "safe-decode", "frame", "checked-decode"]
safe-decode = []
safe-encode = []
checked-decode = [] # Adds important checks while decoding. Only remove on trusted input!
frame = ["std", "dep:twox-hash"]
std = ["alloc"]
alloc = []
# use nightly compiler features
nightly = []

[dependencies]
twox-hash = { version = "2.1.3", default-features = false, features = ["xxhash32"], optional = true }

[profile.bench]
codegen-units = 1
lto = true
opt-level = 3
debug = true

[profile.release]
codegen-units = 1
#debug = true
opt-level = 3
panic = "unwind"

[[bench]]
harness = false
name = "binggan_bench"
path = "benches/binggan_bench.rs"

[[bench]]
harness = false
name = "fixed_output_dest_size"
path = "benches/fixed_output_dest_size.rs"

